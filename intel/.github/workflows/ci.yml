name: Community quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: community-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Run all quality gates
        run: pnpm check

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build Go packages
        run: go build ./...
      - name: Go vet
        run: go vet ./...
      - name: Run Go tests with race detector
        run: go test -race ./...

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Create deterministic worker environment
        run: uv sync --project workers/intelligence --dev --frozen
      - name: Run Python lints
        run: uv run --project workers/intelligence ruff check workers/intelligence
      - name: Run Python tests
        run: uv run --project workers/intelligence pytest workers/intelligence/tests

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri Linux build dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Check native workspace
        run: |
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo clippy --locked --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Run Buf breaking change gate
        env:
          BUF_BREAKING_AGAINST: .git#tag=v1.0.0
        run: pnpm contracts:breaking
