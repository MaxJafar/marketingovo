<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marketingovo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="startup-shell" aria-labelledby="startup-title">
      <div class="brand-mark" aria-hidden="true">A</div>
      <p class="eyebrow">Marketingovo</p>
      <h1 id="startup-title">Preparing your local workspace</h1>
      <p id="startup-status" role="status" aria-live="polite">
        Checking the signed release channel and starting the local service…
      </p>
      <div class="progress-track" aria-hidden="true">
        <span></span>
      </div>
      <p class="privacy-note">
        Projects and credentials remain on this device. The release request path
        contains only the current version, operating system, and CPU
        architecture—never project or account data.
      </p>
    </main>
  </body>
</html>
