[package]
name = "agentintel-desktop"
version = "0.2.0-alpha.0"
description = "Restricted desktop launcher for AGENTintel AGENTintel"
authors = ["MaxJafar"]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
default-run = "agentintel-desktop"

[lib]
name = "agentintel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
keyring = { version = "3.6", features = [
  "apple-native",
  "crypto-rust",
  "linux-native-sync-persistent",
  "windows-native",
] }
minisign-verify = "0.2.5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
thiserror = "2"
url = "2"
walkdir = "2"
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
