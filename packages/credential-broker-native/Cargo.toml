[package]
name = "agentseo-credential-broker"
version = "0.11.0-alpha.0"
description = "Native credential broker for AGENTseo Community Edition"
authors = ["GolemWorkers"]
edition = "2021"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
