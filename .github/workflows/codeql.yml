name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 3"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          # Excludes generated output only — the build below writes bundles and
          # site files that would otherwise be reported alongside the source
          # they came from. Queries and test coverage are unchanged.
          config-file: .github/codeql/codeql-config.yml
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - uses: github/codeql-action/analyze@v4
