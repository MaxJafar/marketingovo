name: Feature request
description: Propose a change or enhancement for AGENTintel.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals concrete. Include behavior, expected user outcome, and tradeoffs.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the exact behavior you want.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: Define how we can verify this feature is complete.
