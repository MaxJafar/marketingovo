name: Bug report
description: Report reproducible incorrect behavior without publishing credentials or private data.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Include only sanitized inputs and outputs. Never include credentials, private URLs, or report artifacts.
  - type: input
    id: version
    attributes:
      label: Version
      description: AGENTintel version where the bug appears.
      placeholder: 0.2.0-alpha.0
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Operating system
      description: Exact OS and version where this happened.
      placeholder: macOS 14.6 / Ubuntu 24.04 / Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: exact_reproduction
    attributes:
      label: Exact reproduction
      description: What did you run, in exact order, to reproduce this?
    validations:
      required: true
  - type: textarea
    id: run_report
    attributes:
      label: What did the run actually report?
      description: Paste the exact command output and failure text.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: Expected result
      description: What should have happened instead?
