name: Marketingovo CodeQL configuration

# `security-extended` stays on. This file only narrows *what* is analysed, never
# which queries run.
#
# The workflow runs `pnpm build` before analysis so CodeQL can resolve the
# TypeScript project graph. That build also writes bundles and site output into
# the working tree, and CodeQL will happily analyse those too — reporting the
# same finding twice, once in the source that a human can fix and once in the
# generated artefact that is overwritten on the next build.
#
# Only generated output is excluded. Tests are deliberately still analysed: a
# helper that mis-parses a URL is worth knowing about even when it never ships.
paths-ignore:
  # Compiled TypeScript and bundled agent-host plugins. The alert belongs on the
  # source in packages/, not on the bundle rebuilt from it.
  - "**/dist/**"
  # The VitePress documentation site build.
  - "apps/docs/dist/**"
  # Protobuf bindings generated by `buf generate` from
  # contracts/proto/marketingovo/v1. Fix the .proto or the generator, never the
  # emitted file.
  - "gen/**"
  - "services/intel-daemon/gen/**"
  # Intentionally defective HTML. These pages exist so the correctness corpus
  # can assert the crawler detects specific defects; their flaws are fixtures,
  # not vulnerabilities.
  - "examples/demo-site/**"
  # Third-party reference corpus. Gitignored, so this is belt and braces: it is
  # studied, never built and never shipped.
  - "TO REVERSE ENGINEEER/**"
