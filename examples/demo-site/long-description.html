<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture with an oversized meta description</title>
    <meta
      name="description"
      content="This deliberately oversized benchmark description is longer than one hundred and fifty five characters so the crawler can verify the exact labeled page instance without depending on customer data or a changing external website."
    />
    <link rel="canonical" href="{{ORIGIN}}/long-description" />
  </head>
  <body>
    <main>
      <h1>Oversized description fixture</h1>
      <p>{{COPY}}</p>
      <a href="/">Benchmark index</a>
    </main>
  </body>
</html>
