<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture whose canonical points to a broken page</title>
    <meta
      name="description"
      content="This fixture deliberately points its canonical link to a known missing destination."
    />
    <link rel="canonical" href="{{ORIGIN}}/missing" />
  </head>
  <body>
    <main>
      <h1>Broken canonical fixture</h1>
      <p>{{COPY}}</p>
      <a href="/">Benchmark index</a>
    </main>
  </body>
</html>
